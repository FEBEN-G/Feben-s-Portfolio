# Try to pull the image with retry logic
# If this fails, you can manually pull or use the workaround below

services:
  db:
    # Note: If postgres:16-alpine times out, try:
    # 1. docker pull postgres:15-alpine
    # 2. Change "16-alpine" to "15-alpine" below
    # 3. Run: docker compose up -d
    
    image: postgres:16-alpine
    container_name: feben-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - feben_pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - portfolio-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feben-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://portfolio:[REDACTED]@db:5432/portfolio
      DATABASE_SSL: "false"
      ADMIN_PASSWORD: portfolio-admin-2025
      ADMIN_SESSION_SECRET: replace-with-a-long-random-secret-at-least-32-chars-here-min-32-chars-needed
      VITE_EMAILJS_SERVICE_ID: your_service_id
      VITE_EMAILJS_TEMPLATE_ID: your_template_id
      VITE_EMAILJS_PUBLIC_KEY: your_public_key
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - /app/node_modules
    networks:
      - portfolio-net

volumes:
  feben_pg_data:

networks:
  portfolio-net:
    driver: bridge
