# Render Blueprint — Dashboard → New → Blueprint → this repo
# Or create a Web Service + Postgres manually with the same commands/env.

databases:
  - name: feben-portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio
    ipAllowList: []

services:
  - type: web
    name: feben-portfolio
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: render_com
      - key: DATABASE_URL
        fromDatabase:
          name: feben-portfolio-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: VITE_EMAILJS_SERVICE_ID
        sync: false
      - key: VITE_EMAILJS_TEMPLATE_ID
        sync: false
      - key: VITE_EMAILJS_PUBLIC_KEY
        sync: false
