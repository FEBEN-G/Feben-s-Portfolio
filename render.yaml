# Render Blueprint — New → Blueprint → select this repo
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: feben-portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio

services:
  - type: web
    name: feben-portfolio
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: render_com
      - key: DATABASE_URL
        fromDatabase:
          name: feben-portfolio-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: VITE_EMAILJS_SERVICE_ID
        sync: false
      - key: VITE_EMAILJS_TEMPLATE_ID
        sync: false
      - key: VITE_EMAILJS_PUBLIC_KEY
        sync: false
