services:
  - type: web
    name: feben-portfolio
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: render_com
      - key: VITE_EMAILJS_SERVICE_ID
        sync: false
      - key: VITE_EMAILJS_TEMPLATE_ID
        sync: false
      - key: VITE_EMAILJS_PUBLIC_KEY
        sync: false
